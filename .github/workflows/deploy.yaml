name: Deploy to FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.2
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./
          # Only exclude files that should never be on the server
          # admin/ data/ assets/ and all site files ARE included
          exclude: |
            **/.git/**
            **/.github/**
            **/node_modules/**
            **/scraps/**
            **/screenshots/**
            **/uploads/**
            README.md
            .gitignore
