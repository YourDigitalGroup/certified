name: Deploy to FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.2
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./
          # Large media files: allow up to 10 minutes per FTP operation instead of the 30 s default.
          timeout: 600000
          # Only exclude files that should never be on the server.
          # admin/ api/ data/ (manifest + .htaccess) assets/ uploads/ and all site files ARE included.
          # uploads/ holds every training video and screenshot (~1.4 GB). The first run after
          # enabling it uploads everything; later runs only send files that changed.
          # The live database (data/portal.sqlite) and admin-uploaded videos
          # (uploads/custom/) are created on the server and never touched here.
          exclude: |
            **/.git/**
            **/.github/**
            **/node_modules/**
            **/scraps/**
            **/screenshots/**
            **/uploads/custom/**
            **/uploads/DC - Process*/**
            **/uploads/*.md
            **/tools/**
            **/vo-scripts/**
            **/data/*.sqlite*
            **/data/tmp/**
            README.md
            ADMIN.md
            CLAUDE.md
            .gitignore
